[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning-partner-agent"
version = "0.1.0"
description = "A local CLI learning partner agent that manages learning plans, chapters, quizzes, and progress."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Learning Partner Agent" }]
dependencies = []

[project.scripts]
learning-partner = "learning_partner.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
